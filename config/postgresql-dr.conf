# /etc/postgresql/17/main/conf.d/10-odoo-dr.conf
# DR subscriber: 10 CPU / 15 GB RAM, PostgreSQL and Odoo on the same host

# memory
shared_buffers = 4GB
effective_cache_size = 10GB
work_mem = 32MB
maintenance_work_mem = 1GB
random_page_cost = 1.1
effective_io_concurrency = 200

# WAL / checkpoints (the first copy writes a lot)
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9

# logical replication subscriber
max_worker_processes = 16
max_logical_replication_workers = 8
max_sync_workers_per_subscription = 4          # tables copied in parallel; 2 is gentler on the publisher
max_parallel_apply_workers_per_subscription = 2

# Odoo after failover (2 instances x 5 workers + cron + tools)
max_connections = 200

# logging
log_timezone = 'UTC'
log_min_duration_statement = 2000
log_line_prefix = '%m [%p] %q%u@%d '

# LAN access for admin tools (rules in pg_hba.conf)
listen_addresses = 'localhost,10.0.0.10'
